<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" fill="none">
  <defs>
    <!-- Background neon green/cyan radial aura -->
    <radialGradient id="dualAura" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35" />
      <stop offset="35%" stop-color="#059669" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#040D1A" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#040D1A" stop-opacity="0" />
    </radialGradient>

    <!-- Lime / Neon Green LED Glow Ring -->
    <linearGradient id="limeRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>

    <!-- Speaker Cylindrical Gradients -->
    <linearGradient id="speakerLeftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080C12" />
      <stop offset="25%" stop-color="#1E2838" />
      <stop offset="50%" stop-color="#0A1017" />
      <stop offset="90%" stop-color="#182230" />
      <stop offset="100%" stop-color="#040608" />
    </linearGradient>

    <linearGradient id="speakerRightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#040608" />
      <stop offset="20%" stop-color="#182230" />
      <stop offset="60%" stop-color="#0A1017" />
      <stop offset="85%" stop-color="#1E2838" />
      <stop offset="100%" stop-color="#080C12" />
    </linearGradient>

    <filter id="limeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <rect width="900" height="650" fill="transparent" />
  <ellipse cx="450" cy="460" rx="380" ry="180" fill="url(#dualAura)" />

  <!-- Base shadows -->
  <ellipse cx="340" cy="510" rx="140" ry="25" fill="#020406" opacity="0.8" />
  <ellipse cx="560" cy="510" rx="140" ry="25" fill="#020406" opacity="0.8" />

  <!-- Left Speaker (Tilted inward ~ -8 deg) -->
  <g transform="translate(340, 360) rotate(-7) translate(-340, -360)">
    <!-- Body -->
    <path d="M 230 180 L 230 460 C 230 495, 450 495, 450 460 L 450 180 Z" fill="url(#speakerLeftGrad)" />
    <!-- Lower rim -->
    <ellipse cx="340" cy="460" rx="110" ry="22" fill="#070A0E" stroke="#162232" stroke-width="2" />
    <!-- Light Reflection -->
    <path d="M 270 185 L 270 465" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.1" />
    <!-- Bezel Top -->
    <ellipse cx="340" cy="180" rx="110" ry="24" fill="#080D14" stroke="#1D2A3C" stroke-width="2" />
    <!-- Neon Lime Illuminated Ring -->
    <ellipse cx="340" cy="178" rx="104" ry="21" fill="none" stroke="url(#limeRing)" stroke-width="4.5" filter="url(#limeGlow)" />
    <ellipse cx="340" cy="178" rx="104" ry="21" fill="none" stroke="#E6FFFA" stroke-width="1.8" />
    <ellipse cx="340" cy="178" rx="98" ry="18" fill="#04070B" />
    <circle cx="340" cy="178" r="3.5" fill="#34D399" filter="url(#limeGlow)" />
  </g>

  <!-- Right Speaker (Tilted inward ~ +7 deg) -->
  <g transform="translate(560, 360) rotate(7) translate(-560, -360)">
    <!-- Body -->
    <path d="M 450 180 L 450 460 C 450 495, 670 495, 670 460 L 670 180 Z" fill="url(#speakerRightGrad)" />
    <!-- Lower rim -->
    <ellipse cx="560" cy="460" rx="110" ry="22" fill="#070A0E" stroke="#162232" stroke-width="2" />
    <!-- Light Reflection -->
    <path d="M 630 185 L 630 465" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.1" />
    <!-- Bezel Top -->
    <ellipse cx="560" cy="180" rx="110" ry="24" fill="#080D14" stroke="#1D2A3C" stroke-width="2" />
    <!-- Neon Lime Illuminated Ring -->
    <ellipse cx="560" cy="178" rx="104" ry="21" fill="none" stroke="url(#limeRing)" stroke-width="4.5" filter="url(#limeGlow)" />
    <ellipse cx="560" cy="178" rx="104" ry="21" fill="none" stroke="#E6FFFA" stroke-width="1.8" />
    <ellipse cx="560" cy="178" rx="98" ry="18" fill="#04070B" />
    <circle cx="560" cy="178" r="3.5" fill="#34D399" filter="url(#limeGlow)" />
  </g>
</svg>

