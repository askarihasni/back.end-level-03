<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" fill="none">
  <defs>
    <!-- Background Radial Atmosphere -->
    <radialGradient id="heroGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#1B3A6B" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#081426" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#081426" stop-opacity="0" />
    </radialGradient>

    <!-- Speaker Cylindrical Body Gradients -->
    <linearGradient id="speakerBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060A10" />
      <stop offset="18%" stop-color="#121824" />
      <stop offset="38%" stop-color="#243044" />
      <stop offset="55%" stop-color="#0B1017" />
      <stop offset="85%" stop-color="#171F2C" />
      <stop offset="100%" stop-color="#040609" />
    </linearGradient>

    <!-- Speaker Top Rim Light (Cyan/Electric Blue Ring) -->
    <linearGradient id="ringGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39C6E8" />
      <stop offset="50%" stop-color="#3478F6" />
      <stop offset="100%" stop-color="#39C6E8" />
    </linearGradient>

    <!-- Top Concave Dome -->
    <radialGradient id="topDome" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#05080E" />
      <stop offset="75%" stop-color="#101722" />
      <stop offset="92%" stop-color="#2A384E" />
      <stop offset="100%" stop-color="#39C6E8" />
    </radialGradient>

    <!-- Sculpted Terrain Pedestal Waves (from reference video) -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2536" />
      <stop offset="50%" stop-color="#0C121D" />
      <stop offset="100%" stop-color="#04070C" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#25354D" />
      <stop offset="60%" stop-color="#101824" />
      <stop offset="100%" stop-color="#05080E" />
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="neonRing" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="450" cy="380" r="380" fill="url(#heroGlow)" />

  <!-- Lower Sculpted Wave / Terrain Pedestal (from reference video 00:03-00:05) -->
  <g opacity="0.95">
    <path d="M0 640 Q 220 540 450 620 T 900 600 L 900 800 L 0 800 Z" fill="url(#waveGrad1)" />
    <path d="M50 670 Q 280 570 520 640 Q 720 590 900 650 L 900 800 L 0 800 Z" fill="url(#waveGrad2)" opacity="0.8" />
    <path d="M0 690 Q 200 630 400 680 Q 650 620 900 710 L 900 800 L 0 800 Z" fill="#06090F" />
    
    <!-- Topographic / Fold highlights on dark dunes -->
    <path d="M120 610 Q 310 520 480 590 Q 680 560 840 630" stroke="#3478F6" stroke-width="1.5" stroke-opacity="0.3" fill="none" />
    <path d="M180 640 Q 360 560 540 620 Q 730 580 880 650" stroke="#39C6E8" stroke-width="1" stroke-opacity="0.25" fill="none" />
    <path d="M260 660 Q 420 600 600 640 Q 770 610 890 680" stroke="#39C6E8" stroke-width="0.75" stroke-opacity="0.15" fill="none" />
  </g>

  <!-- Cylindrical Speaker Shadow -->
  <ellipse cx="450" cy="565" rx="195" ry="32" fill="#010306" opacity="0.9" filter="url(#softGlow)" />

  <!-- Main Speaker Body -->
  <g>
    <!-- Base Cylinder -->
    <path d="M 285 280 L 285 530 C 285 570, 615 570, 615 530 L 615 280 Z" fill="url(#speakerBody)" />
    
    <!-- Fine acoustic mesh texture simulation -->
    <path d="M 290 320 L 290 515 C 290 545, 610 545, 610 515 L 610 320 C 610 345, 290 345, 290 320 Z" fill="#0C131D" opacity="0.65" />
    
    <!-- Subtle vertical reflection line -->
    <path d="M 370 270 L 370 540" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.08" />
    <path d="M 400 275 L 400 545" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.12" />
    <path d="M 408 275 L 408 545" stroke="#39C6E8" stroke-width="1.5" stroke-opacity="0.3" />

    <!-- Speaker Base Footing -->
    <ellipse cx="450" cy="532" rx="165" ry="24" fill="#070A0F" stroke="#162232" stroke-width="2" />

    <!-- Upper Bezel & Illuminated Glowing LED Ring -->
    <ellipse cx="450" cy="280" rx="165" ry="32" fill="#080C12" stroke="#25354D" stroke-width="3" />
    
    <!-- Radiant Glowing Ring (Cyan/Electric Blue LED Ring) -->
    <ellipse cx="450" cy="277" rx="158" ry="28" fill="none" stroke="url(#ringGlow)" stroke-width="5" filter="url(#neonRing)" />
    <ellipse cx="450" cy="277" rx="158" ry="28" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.85" />

    <!-- Inner Concave Top Surface -->
    <ellipse cx="450" cy="276" rx="150" ry="25" fill="url(#topDome)" />

    <!-- Center Control / Touch Disc -->
    <ellipse cx="450" cy="276" rx="60" ry="12" fill="#05080E" stroke="#1A273A" stroke-width="2" />
    <circle cx="450" cy="276" r="3.5" fill="#39C6E8" filter="url(#neonRing)" />
  </g>
</svg>

