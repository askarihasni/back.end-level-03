<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 750" fill="none">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="towerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#081426" stop-opacity="0" />
    </radialGradient>

    <!-- Monolith Tower Gradients -->
    <linearGradient id="monolithFront" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141C28" />
      <stop offset="48%" stop-color="#0A1018" />
      <stop offset="52%" stop-color="#0A1018" />
      <stop offset="100%" stop-color="#1A2536" />
    </linearGradient>

    <linearGradient id="monolithSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#070C14" />
      <stop offset="100%" stop-color="#101824" />
    </linearGradient>

    <linearGradient id="monolithTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E2A3A" />
      <stop offset="100%" stop-color="#2D3E54" />
    </linearGradient>

    <!-- Cyan Glowing LED Vertical Bar -->
    <linearGradient id="cyanStripe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#39C6E8" />
      <stop offset="25%" stop-color="#00F0FF" />
      <stop offset="75%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3478F6" />
    </linearGradient>

    <filter id="cyanGlow" x="-50%" y="-20%" width="200%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="700" height="750" fill="transparent" />
  <circle cx="350" cy="380" r="300" fill="url(#towerGlow)" />

  <!-- Shadow underneath -->
  <ellipse cx="350" cy="670" rx="190" ry="24" fill="#020408" opacity="0.85" />

  <!-- Isometric / Angled Tower Monolith Geometry -->
  <!-- Top Face -->
  <polygon points="350,140 480,200 350,260 220,200" fill="url(#monolithTop)" stroke="#39C6E8" stroke-width="0.8" stroke-opacity="0.4" />
  <ellipse cx="350" cy="200" rx="42" ry="18" fill="#0A1018" stroke="#39C6E8" stroke-width="1.5" stroke-opacity="0.8" />
  <circle cx="350" cy="200" r="3" fill="#00F0FF" />

  <!-- Left Side Face -->
  <polygon points="220,200 350,260 350,650 220,590" fill="url(#monolithSide)" />
  <!-- Acoustic mesh left subtle pattern -->
  <polygon points="230,225 340,275 340,630 230,580" fill="#080E17" opacity="0.6" />

  <!-- Right Front Face -->
  <polygon points="350,260 480,200 480,590 350,650" fill="url(#monolithFront)" />
  <!-- Acoustic mesh right subtle pattern -->
  <polygon points="360,275 470,225 470,580 360,630" fill="#0D1520" opacity="0.6" />

  <!-- Center Vertical Glowing Cyan Stripe (matching frame 00:21-00:24) -->
  <line x1="350" y1="262" x2="350" y2="648" stroke="url(#cyanStripe)" stroke-width="5" stroke-linecap="round" filter="url(#cyanGlow)" />
  <line x1="350" y1="262" x2="350" y2="648" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
</svg>

